<button class="btn btn--outline-secondary command-palette-trigger" type="button" data-command-open aria-haspopup="dialog" aria-keyshortcuts="Control+K Meta+K">
    <svg class="btn__icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
    Search commands…
    <kbd>Ctrl K</kbd>
</button>

<dialog class="command-palette" aria-label="Command palette" data-command-palette>
    <div class="command-palette__search">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        <input class="command-palette__input" type="text" role="combobox" aria-expanded="true" aria-controls="command-palette-listbox" aria-autocomplete="list" aria-label="Search commands" placeholder="Type a command or search…" autocomplete="off" data-command-input>
        <kbd>Esc</kbd>
    </div>
    <div class="command-palette__results" id="command-palette-listbox" role="listbox" aria-label="Commands">
            <p class="command-palette__group" id="command-group-navigation" aria-hidden="true">Navigation</p>
            <ul class="command-palette__list" role="group" aria-labelledby="command-group-navigation">
                <li class="command-palette__option" role="option" id="command-go-to-dashboard" aria-selected="false" data-command>Go to dashboard<span class="command-palette__keys"><kbd>G</kbd><kbd>D</kbd></span></li>
                <li class="command-palette__option" role="option" id="command-go-to-projects" aria-selected="false" data-command>Go to projects<span class="command-palette__keys"><kbd>G</kbd><kbd>P</kbd></span></li>
                <li class="command-palette__option" role="option" id="command-go-to-settings" aria-selected="false" data-command>Go to settings<span class="command-palette__keys"><kbd>G</kbd><kbd>S</kbd></span></li>
            </ul>
            <p class="command-palette__group" id="command-group-actions" aria-hidden="true">Actions</p>
            <ul class="command-palette__list" role="group" aria-labelledby="command-group-actions">
                <li class="command-palette__option" role="option" id="command-create-a-new-page" aria-selected="false" data-command>Create a new page<span class="command-palette__keys"><kbd>N</kbd></span></li>
                <li class="command-palette__option" role="option" id="command-invite-a-teammate" aria-selected="false" data-command>Invite a teammate<span class="command-palette__keys"><kbd>I</kbd></span></li>
                <li class="command-palette__option" role="option" id="command-switch-design-style" aria-selected="false" data-command>Switch design style<span class="command-palette__keys"><kbd>S</kbd></span></li>
            </ul>
            <p class="command-palette__group" id="command-group-help" aria-hidden="true">Help</p>
            <ul class="command-palette__list" role="group" aria-labelledby="command-group-help">
                <li class="command-palette__option" role="option" id="command-read-the-documentation" aria-selected="false" data-command>Read the documentation<span class="command-palette__keys"><kbd>?</kbd></span></li>
                <li class="command-palette__option" role="option" id="command-contact-support" aria-selected="false" data-command>Contact support<span class="command-palette__keys"></span></li>
            </ul>
    </div>
    <p class="command-palette__empty" hidden data-command-empty>No results.</p>
    <p class="sr-only" aria-live="polite" data-command-status></p>
</dialog>
