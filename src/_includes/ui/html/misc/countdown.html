<section class="countdown" aria-labelledby="countdown-title" data-countdown data-countdown-days="12">
    <h2 class="countdown__title" id="countdown-title">The launch sale ends in</h2>
    <p class="countdown__timer" role="timer" aria-live="off" data-countdown-timer>
        <span class="countdown__unit"><span class="countdown__value" data-unit="days">12</span><span class="countdown__label">Days</span></span>
        <span class="countdown__unit"><span class="countdown__value" data-unit="hours">00</span><span class="countdown__label">Hours</span></span>
        <span class="countdown__unit"><span class="countdown__value" data-unit="minutes">00</span><span class="countdown__label">Minutes</span></span>
        <span class="countdown__unit"><span class="countdown__value" data-unit="seconds">00</span><span class="countdown__label">Seconds</span></span>
    </p>
    <p class="sr-only" data-countdown-text></p>
    <a class="btn btn--primary" href="#">Get 40% off</a>
</section>
