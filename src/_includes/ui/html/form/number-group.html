<div class="form-group">
    <label class="form-label" for="quantity">Quantity</label>
    <div class="number-group" data-number-group>
        <button class="btn btn--primary btn--sm btn--icon number-group__decrement" type="button" aria-controls="quantity" data-step="-1">
            <span class="sr-only">Decrease quantity</span>
            <svg class="btn__icon" aria-hidden="true" fill="none" focusable="false" stroke-linecap="round" stroke-linejoin="round" stroke-width="3.5" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M5 12h14"/></svg>
        </button>
        <input class="number-group__input" id="quantity" type="number" inputmode="numeric" name="quantity" value="1" min="1" max="10" step="1" aria-describedby="quantity-help">
        <button class="btn btn--primary btn--sm btn--icon number-group__increment" type="button" aria-controls="quantity" data-step="1">
            <span class="sr-only">Increase quantity</span>
            <svg class="btn__icon" aria-hidden="true" fill="none" focusable="false" stroke-linecap="round" stroke-linejoin="round" stroke-width="3.5" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M12 5v14M5 12h14"/></svg>
        </button>
    </div>
    <p class="form-description" id="quantity-help">Maximum 10 per order.</p>
</div>
