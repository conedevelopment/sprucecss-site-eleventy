<div class="range-group" data-range-group data-unit-one="seat" data-unit-many="seats">
    <div class="range-group__label">
        <label class="form-label" for="seats">Seats</label>
        <output class="range-group__value" for="seats" aria-hidden="true"></output>
    </div>
    <div class="range-group__inner">
        <button class="btn btn--primary btn--sm btn--icon" type="button" aria-controls="seats" data-step="-1">
            <span class="sr-only">Decrease seats</span>
            <svg class="btn__icon" aria-hidden="true" fill="none" focusable="false" stroke-linecap="round" stroke-linejoin="round" stroke-width="3.5" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M5 12h14"/></svg>
        </button>
        <input class="form-range range-group__control" id="seats" type="range" min="1" max="50" value="5" step="1">
        <button class="btn btn--primary btn--sm btn--icon" type="button" aria-controls="seats" data-step="1">
            <span class="sr-only">Increase seats</span>
            <svg class="btn__icon" aria-hidden="true" fill="none" focusable="false" stroke-linecap="round" stroke-linejoin="round" stroke-width="3.5" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M12 5v14M5 12h14"/></svg>
        </button>
    </div>
</div>

<div class="range-group" data-range-group data-unit-one="GB" data-unit-many="GB">
    <div class="range-group__label">
        <label class="form-label" for="storage">Storage</label>
        <output class="range-group__value" for="storage" aria-hidden="true"></output>
    </div>
    <div class="range-group__inner">
        <button class="btn btn--primary btn--sm btn--icon" type="button" aria-controls="storage" data-step="-1">
            <span class="sr-only">Decrease storage</span>
            <svg class="btn__icon" aria-hidden="true" fill="none" focusable="false" stroke-linecap="round" stroke-linejoin="round" stroke-width="3.5" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M5 12h14"/></svg>
        </button>
        <input class="form-range range-group__control" id="storage" type="range" min="10" max="500" value="100" step="10">
        <button class="btn btn--primary btn--sm btn--icon" type="button" aria-controls="storage" data-step="1">
            <span class="sr-only">Increase storage</span>
            <svg class="btn__icon" aria-hidden="true" fill="none" focusable="false" stroke-linecap="round" stroke-linejoin="round" stroke-width="3.5" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M12 5v14M5 12h14"/></svg>
        </button>
    </div>
</div>
