<fieldset class="segmented-control">
    <legend class="sr-only">Billing period</legend>
    <label class="segmented-control__option">
        <input class="segmented-control__input" type="radio" name="billing" value="monthly" checked>
        <span>Monthly</span>
    </label>
    <label class="segmented-control__option">
        <input class="segmented-control__input" type="radio" name="billing" value="yearly">
        <span>Yearly <small class="segmented-control__hint">−20%</small></span>
    </label>
    <label class="segmented-control__option">
        <input class="segmented-control__input" type="radio" name="billing" value="lifetime">
        <span>Lifetime</span>
    </label>
</fieldset>
