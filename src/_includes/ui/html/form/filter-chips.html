<div class="filter-chips" data-filter-chips>
    <div class="filter-chips__list" role="group" aria-label="Filter jobs">
        <button class="filter-chip" type="button" aria-pressed="true">Remote</button>
        <button class="filter-chip" type="button" aria-pressed="false">Full-time</button>
        <button class="filter-chip" type="button" aria-pressed="true">Design</button>
        <button class="filter-chip" type="button" aria-pressed="false">Engineering</button>
        <button class="filter-chip" type="button" aria-pressed="false">Senior</button>
        <button class="filter-chip" type="button" aria-pressed="false">Part-time</button>
    </div>
    <button class="btn btn--link btn--sm filter-chips__clear" type="button" data-filter-chips-clear>Clear all</button>
    <p class="sr-only" aria-live="polite" data-filter-chips-status></p>
</div>
