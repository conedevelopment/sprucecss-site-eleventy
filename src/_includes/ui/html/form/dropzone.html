<div class="dropzone" data-dropzone>
    <input class="dropzone__input" id="dropzone-input" type="file" multiple accept="image/*,.pdf" data-dropzone-input>
    <label class="dropzone__area" for="dropzone-input" data-dropzone-area>
        <svg class="dropzone__icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m17 8-5-5-5 5"/><path d="M12 3v12"/></svg>
        <span class="dropzone__title"><strong>Click to upload</strong> or drag and drop</span>
        <span class="dropzone__hint" id="dropzone-hint">Images or PDF, up to 10 MB each</span>
    </label>
    <ul class="dropzone__files" role="list" aria-label="Selected files" data-dropzone-files></ul>
    <p class="sr-only" aria-live="polite" data-dropzone-status></p>
</div>
