<form class="otp-input" onsubmit="return false;">
    <fieldset>
        <legend class="otp-input__legend">Enter the 6-digit code</legend>
        <p class="otp-input__hint" id="otp-hint">We sent it to j•••@example.com.</p>
        <div class="otp-input__digits" data-otp aria-describedby="otp-hint">
        <input class="form-control otp-input__digit" type="text" inputmode="numeric" pattern="[0-9]" maxlength="1" autocomplete="one-time-code" aria-label="Digit 1 of 6" required>
        <input class="form-control otp-input__digit" type="text" inputmode="numeric" pattern="[0-9]" maxlength="1" autocomplete="off" aria-label="Digit 2 of 6" required>
        <input class="form-control otp-input__digit" type="text" inputmode="numeric" pattern="[0-9]" maxlength="1" autocomplete="off" aria-label="Digit 3 of 6" required>
        <input class="form-control otp-input__digit" type="text" inputmode="numeric" pattern="[0-9]" maxlength="1" autocomplete="off" aria-label="Digit 4 of 6" required>
        <input class="form-control otp-input__digit" type="text" inputmode="numeric" pattern="[0-9]" maxlength="1" autocomplete="off" aria-label="Digit 5 of 6" required>
        <input class="form-control otp-input__digit" type="text" inputmode="numeric" pattern="[0-9]" maxlength="1" autocomplete="off" aria-label="Digit 6 of 6" required>
        </div>
    </fieldset>
    <button class="btn btn--primary btn--block" type="submit">Verify</button>
    <p class="otp-input__resend">Didn’t get it? <button class="btn btn--link btn--sm" type="button">Resend code</button></p>
</form>
