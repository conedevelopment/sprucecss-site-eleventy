<div class="password-field" data-password-field>
    <label class="form-label form-label--required" for="new-password">New password</label>
    <div class="password-field__control">
        <input class="form-control" id="new-password" type="password" autocomplete="new-password" aria-describedby="password-strength password-rules" required>
        <button class="btn btn--ghost-secondary btn--icon btn--sm password-field__toggle" type="button" aria-pressed="false" aria-controls="new-password" data-password-toggle>
            <svg class="btn__icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
            <span class="sr-only">Show password</span>
        </button>
    </div>
    <meter class="password-field__meter" min="0" max="4" low="2" high="3" optimum="4" value="0" aria-hidden="true" data-password-meter></meter>
    <p class="password-field__strength" id="password-strength" aria-live="polite" data-password-strength>Strength: too short</p>
    <ul class="password-field__rules" id="password-rules" role="list">
        <li data-rule="length">At least 12 characters</li>
        <li data-rule="case">Upper- and lowercase letters</li>
        <li data-rule="number">At least one number</li>
        <li data-rule="symbol">At least one symbol</li>
    </ul>
</div>
