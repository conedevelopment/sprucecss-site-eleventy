<fieldset class="form-size-option" data-option-group>
    <legend class="form-size-option__label">
        Size: <span class="form-size-option__selected" data-option-selected>M</span>
    </legend>
    <div class="form-size-option__inner">
        <label class="form-size">
            <input class="form-size__control" type="radio" value="xs" name="size" data-label="XS"/>
            <span class="form-size__label">XS</span>
        </label>
        <label class="form-size">
            <input class="form-size__control" type="radio" value="s" name="size" data-label="S" disabled/>
            <span class="form-size__label">S</span>
            <span class="sr-only">(sold out)</span>
        </label>
        <label class="form-size">
            <input class="form-size__control" type="radio" value="m" name="size" data-label="M" checked/>
            <span class="form-size__label">M</span>
        </label>
        <label class="form-size">
            <input class="form-size__control" type="radio" value="l" name="size" data-label="L"/>
            <span class="form-size__label">L</span>
        </label>
        <label class="form-size">
            <input class="form-size__control" type="radio" value="xl" name="size" data-label="XL"/>
            <span class="form-size__label">XL</span>
        </label>
        <label class="form-size">
            <input class="form-size__control" type="radio" value="xxl" name="size" data-label="XXL" disabled/>
            <span class="form-size__label">XXL</span>
            <span class="sr-only">(sold out)</span>
        </label>
    </div>
    <p class="form-size-option__help"><a class="form-size-option__guide" href="#">Size guide</a></p>
</fieldset>
