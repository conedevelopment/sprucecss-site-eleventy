<figure class="donut-chart">
    <figcaption class="donut-chart__caption">
        <span class="donut-chart__title">Traffic sources</span>
        <span class="donut-chart__subtitle">Last 30 days</span>
    </figcaption>
    <div class="donut-chart__body">
        <div class="donut-chart__ring" style="--segment-1: 42%; --segment-2: 70%; --segment-3: 88%;">
            <p class="donut-chart__total"><strong>24.8k</strong> visits</p>
        </div>
        <ul class="donut-chart__legend" role="list">
            <li class="donut-chart__key"><span class="donut-chart__swatch" aria-hidden="true"></span><span class="donut-chart__label">Organic search</span><span class="donut-chart__value">42%</span></li>
            <li class="donut-chart__key"><span class="donut-chart__swatch" aria-hidden="true"></span><span class="donut-chart__label">Direct</span><span class="donut-chart__value">28%</span></li>
            <li class="donut-chart__key"><span class="donut-chart__swatch" aria-hidden="true"></span><span class="donut-chart__label">Social</span><span class="donut-chart__value">18%</span></li>
            <li class="donut-chart__key"><span class="donut-chart__swatch" aria-hidden="true"></span><span class="donut-chart__label">Referral</span><span class="donut-chart__value">12%</span></li>
        </ul>
    </div>
</figure>
