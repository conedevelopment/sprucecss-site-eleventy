<p class="tooltip-demo">
    Hover or focus the buttons:
    <span class="tooltip">
        <button class="btn btn--outline-primary btn--icon" type="button" aria-describedby="tooltip-copy">
            <svg class="btn__icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect width="14" height="14" x="8" y="8" rx="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
            <span class="sr-only">Copy</span>
        </button>
        <span class="tooltip__content" role="tooltip" id="tooltip-copy">Copy to clipboard</span>
    </span>
    <span class="tooltip tooltip--bottom">
        <button class="btn btn--primary" type="button" aria-describedby="tooltip-publish">Publish</button>
        <span class="tooltip__content" role="tooltip" id="tooltip-publish">Visible to everyone with the link</span>
    </span>
</p>
