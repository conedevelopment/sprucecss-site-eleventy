<div class="progress-ring-demo">
    <figure class="progress-ring" style="--value: 72;">
        <svg viewBox="0 0 36 36" aria-hidden="true" focusable="false">
            <circle class="progress-ring__track" cx="18" cy="18" r="15.915"></circle>
            <circle class="progress-ring__bar" cx="18" cy="18" r="15.915" pathLength="100"></circle>
        </svg>
        <span class="progress-ring__value" role="img" aria-label="Profile complete: 72%">72%</span>
        <figcaption class="progress-ring__label">Profile complete</figcaption>
    </figure>
    <figure class="progress-ring progress-ring--warning" style="--value: 45;">
        <svg viewBox="0 0 36 36" aria-hidden="true" focusable="false">
            <circle class="progress-ring__track" cx="18" cy="18" r="15.915"></circle>
            <circle class="progress-ring__bar" cx="18" cy="18" r="15.915" pathLength="100"></circle>
        </svg>
        <span class="progress-ring__value" role="img" aria-label="Storage used: 45%">45%</span>
        <figcaption class="progress-ring__label">Storage used</figcaption>
    </figure>
    <figure class="progress-ring progress-ring--success" style="--value: 100;">
        <svg viewBox="0 0 36 36" aria-hidden="true" focusable="false">
            <circle class="progress-ring__track" cx="18" cy="18" r="15.915"></circle>
            <circle class="progress-ring__bar" cx="18" cy="18" r="15.915" pathLength="100"></circle>
        </svg>
        <span class="progress-ring__value" role="img" aria-label="Course finished: 100%">100%</span>
        <figcaption class="progress-ring__label">Course finished</figcaption>
    </figure>
    <figure class="progress-ring progress-ring--sm" style="--value: 18;">
        <svg viewBox="0 0 36 36" aria-hidden="true" focusable="false">
            <circle class="progress-ring__track" cx="18" cy="18" r="15.915"></circle>
            <circle class="progress-ring__bar" cx="18" cy="18" r="15.915" pathLength="100"></circle>
        </svg>
        <span class="progress-ring__value" role="img" aria-label="Budget spent: 18%">18%</span>
        <figcaption class="progress-ring__label">Budget spent</figcaption>
    </figure>
</div>
