<button class="btn btn--primary" type="button" data-modal-open="invite-modal">Invite teammates</button>

<dialog class="modal" id="invite-modal" aria-labelledby="invite-modal-title" aria-describedby="invite-modal-description">
    <form class="modal__form" method="dialog" data-modal-form>
        <header class="modal__header">
            <div class="modal__header-caption">
                <h2 class="modal__title" id="invite-modal-title">Invite teammates</h2>
                <p class="modal__subtitle" id="invite-modal-description">They’ll get an email with a link to join the Acme workspace.</p>
            </div>
            <button class="btn btn--icon btn--sm btn--ghost-primary modal__close" type="button" data-modal-close>
                <span class="sr-only">Close</span>
                <svg class="btn__icon" aria-hidden="true" fill="none" focusable="false" stroke-linecap="round" stroke-linejoin="round" stroke-width="3.5" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M18 6 6 18M6 6l12 12"/></svg>
            </button>
        </header>
        <div class="modal__body">
            <div class="form-group">
                <label class="form-label" for="invite-emails">Email addresses</label>
                <textarea class="form-control" id="invite-emails" name="emails" rows="3" required aria-describedby="invite-emails-help" autofocus></textarea>
                <p class="form-description" id="invite-emails-help">Separate the addresses with commas.</p>
            </div>
            <div class="form-group">
                <label class="form-label" for="invite-role">Role</label>
                <select class="form-control" id="invite-role" name="role">
                    <option>Member</option>
                    <option>Admin</option>
                    <option>Viewer</option>
                </select>
            </div>
        </div>
        <footer class="modal__footer">
            <button class="btn btn--outline-primary" type="button" data-modal-close>Cancel</button>
            <button class="btn btn--primary" type="submit" value="send">Send invites</button>
        </footer>
    </form>
</dialog>
