<div class="l-checkout">
    <div class="container">
        <form class="l-checkout__inner" method="post" action="#" data-checkout>
            <div class="l-checkout__column">
                <div class="l-checkout__billing">
                    <h2 class="l-checkout__title">Billing information</h2>
                    <div class="l-checkout__form">
                        <div class="form-row--mixed">
                            <div class="form-group">
                                <label class="form-label" for="checkout-name">Full name</label>
                                <input class="form-control" type="text" id="checkout-name" name="name" autocomplete="name" required>
                            </div>
                            <div class="form-group">
                                <label class="form-label" for="checkout-email">Email</label>
                                <input class="form-control" type="email" id="checkout-email" name="email" autocomplete="email" spellcheck="false" required aria-describedby="checkout-email-help">
                                <p class="form-description" id="checkout-email-help">We’ll send the receipt here.</p>
                            </div>
                        </div>
                        <div class="form-row--mixed">
                            <div class="form-group">
                                <label class="form-label" for="checkout-country">Country</label>
                                <input class="form-control" type="text" id="checkout-country" name="country" autocomplete="country-name" required>
                            </div>
                            <div class="form-group">
                                <label class="form-label" for="checkout-zip">Postal code</label>
                                <input class="form-control" type="text" id="checkout-zip" name="zip" autocomplete="postal-code" required>
                            </div>
                            <div class="form-group">
                                <label class="form-label" for="checkout-city">City</label>
                                <input class="form-control" type="text" id="checkout-city" name="city" autocomplete="address-level2" required>
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="checkout-address">Street address</label>
                            <input class="form-control" type="text" id="checkout-address" name="address" autocomplete="street-address" required>
                        </div>
                    </div>
                </div>
                <div class="l-checkout__payment">
                    <h2 class="l-checkout__title">Payment method</h2>
                    {% include "../card/payment.html" %}
                </div>
            </div>
            <div class="l-checkout__column">
                <div class="l-checkout__summary">
                    <h2 class="l-checkout__title">Order summary</h2>
                    {% include "../card/order.html" %}
                    <div class="l-checkout__order">
                        <p class="l-checkout__total">Total <strong data-checkout-total>€200</strong></p>
                        <label class="form-check">
                            <input class="form-check__control" type="checkbox" value="true" name="terms" required>
                            <span class="form-label form-check__label">I accept the <a href="#">privacy policy</a> and the <a href="#">terms and conditions</a>.</span>
                        </label>
                        <div class="form-group--submit">
                            <button class="btn btn--primary btn--lg btn--block" type="submit">
                                <svg class="btn__icon" aria-hidden="true" focusable="false" height="24" style="fill-rule:evenodd;clip-rule:evenodd;fill:currentColor;overflow:visible;" viewBox="0 0 24 24" width="24" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns="http://www.w3.org/2000/svg">
                                    <path d="M24,4.8l0,14.4c0,0.66 -0.235,1.225 -0.705,1.695c-0.47,0.47 -1.035,0.705 -1.695,0.705l-19.2,0c-0.66,0 -1.225,-0.235 -1.695,-0.705c-0.47,-0.47 -0.705,-1.035 -0.705,-1.695l-0,-14.4c-0,-0.66 0.235,-1.225 0.705,-1.695c0.47,-0.47 1.035,-0.705 1.695,-0.705l19.2,0c0.66,0 1.225,0.235 1.695,0.705c0.47,0.47 0.705,1.035 0.705,1.695Zm-21.6,2.4l19.2,0l0,-2.4l-19.2,0l0,2.4Zm0,4.8l0,7.2l19.2,0l0,-7.2l-19.2,0Zm0,7.2l0,-14.4l0,14.4Z"></path>
                                </svg>
                                Pay <span data-checkout-total>€200</span>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </form>
    </div>
</div>
