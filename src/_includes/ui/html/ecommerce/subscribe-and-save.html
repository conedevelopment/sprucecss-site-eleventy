<form class="subscribe-save" action="#" method="post" data-subscribe-save data-price="24" data-discount="15">
    <fieldset class="subscribe-save__options">
        <legend class="subscribe-save__legend">Purchase option</legend>
        <label class="form-check subscribe-save__option">
            <input class="form-check__control" type="radio" name="purchase" value="once">
            <span class="subscribe-save__text">
                <strong>One-time purchase</strong>
            </span>
            <span class="subscribe-save__price">$24.00</span>
        </label>
        <div class="subscribe-save__option subscribe-save__option--subscribe">
            <label class="form-check subscribe-save__label">
                <input class="form-check__control" type="radio" name="purchase" value="subscribe" checked>
                <span class="subscribe-save__text">
                    <strong>Subscribe & save 15%</strong>
                    <span class="badge badge--success">Best value</span>
                </span>
                <span class="subscribe-save__price"><span class="sr-only">Subscription price: </span>$20.40 <del><span class="sr-only">Regular price: </span>$24.00</del></span>
            </label>
            <div class="subscribe-save__details" data-subscribe-save-details>
                <label class="form-label" for="subscribe-frequency">Deliver every</label>
                <select class="form-control form-control--sm" id="subscribe-frequency" name="frequency">
                    <option value="2">2 weeks</option>
                    <option value="4" selected>4 weeks (most popular)</option>
                    <option value="6">6 weeks</option>
                    <option value="8">8 weeks</option>
                </select>
                <ul class="subscribe-save__perks" role="list">
                    <li>Free shipping on every delivery</li>
                    <li>Skip, pause or cancel anytime</li>
                </ul>
            </div>
        </div>
    </fieldset>
    <div class="subscribe-save__buy">
        <div class="subscribe-save__quantity">
            <label class="form-label" for="subscribe-quantity">Quantity</label>
            <select class="form-control" id="subscribe-quantity" name="quantity">
                <option>1</option>
                <option>2</option>
                <option>3</option>
            </select>
        </div>
        <button class="btn btn--primary btn--lg subscribe-save__submit" type="submit" data-subscribe-save-submit>Subscribe · $20.40 every 4 weeks</button>
    </div>
</form>
