<section class="gift-card" aria-labelledby="gift-card-title" data-gift-card>
    <div class="gift-card__preview" aria-hidden="true">
        <div class="gift-card__card">
            <span class="gift-card__brand">Spruce Store</span>
            <span class="gift-card__amount" data-gift-card-amount>$50</span>
            <span class="gift-card__to" data-gift-card-to>For someone special</span>
            <span class="gift-card__message" data-gift-card-message>Enjoy!</span>
        </div>
    </div>
    <form class="gift-card__form" action="#" method="post" data-gift-card-form>
        <h2 class="gift-card__title" id="gift-card-title">Send a gift card</h2>
        <fieldset class="gift-card__amounts">
            <legend class="form-label">Amount</legend>
            <div class="gift-card__options">
                <label class="gift-card__option"><input type="radio" name="amount" value="25"><span>$25</span></label>
                <label class="gift-card__option"><input type="radio" name="amount" value="50" checked><span>$50</span></label>
                <label class="gift-card__option"><input type="radio" name="amount" value="100"><span>$100</span></label>
                <label class="gift-card__option"><input type="radio" name="amount" value="custom"><span>Other</span></label>
            </div>
            <div class="gift-card__custom" data-gift-card-custom>
                <label class="form-label" for="gift-card-custom">Custom amount <span class="form-description">($10–$500)</span></label>
                <div class="gift-card__currency">
                    <span aria-hidden="true">$</span>
                    <input class="form-control" id="gift-card-custom" name="custom" type="number" inputmode="numeric" min="10" max="500" step="1" placeholder="75">
                </div>
            </div>
        </fieldset>
        <div class="gift-card__row">
            <div class="form-group">
                <label class="form-label form-label--required" for="gift-card-name">Recipient name</label>
                <input class="form-control" id="gift-card-name" name="name" type="text" autocomplete="off" required>
            </div>
            <div class="form-group">
                <label class="form-label form-label--required" for="gift-card-email">Recipient email</label>
                <input class="form-control" id="gift-card-email" name="email" type="email" autocomplete="off" required>
            </div>
        </div>
        <div class="form-group">
            <label class="form-label" for="gift-card-message">Message <span class="form-description" data-gift-card-counter>(120 characters left)</span></label>
            <textarea class="form-control" id="gift-card-message" name="message" rows="3" maxlength="120" placeholder="Enjoy!"></textarea>
        </div>
        <div class="form-group">
            <label class="form-label" for="gift-card-date">Delivery date</label>
            <input class="form-control" id="gift-card-date" name="date" type="date">
            <p class="form-description">Leave it empty to send it right away.</p>
        </div>
        <button class="btn btn--primary btn--lg" type="submit">Add to cart</button>
    </form>
</section>
